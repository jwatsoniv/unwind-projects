<script>
document.addEventListener('DOMContentLoaded', function () {
  var searchBar = document.querySelector('.incarousel-search-bar');
  var form = searchBar ? searchBar.querySelector('form[action="/properties"]') : null;
  if (form) {
    var chips = document.createElement('div'); chips.className='uw-chips';
    chips.innerHTML = '<span class="uw-chips-label">Just browsing?</span>' +
      '<button type="button" class="uw-chip" data-beds="1" data-exact="1">1 Bedroom</button>' +
      '<button type="button" class="uw-chip" data-beds="2" data-exact="1">2 Bedrooms</button>' +
      '<button type="button" class="uw-chip" data-beds="3" data-exact="1">3 Bedrooms</button>' +
      '<button type="button" class="uw-chip" data-beds="4">4+ Bedrooms</button>';
    searchBar.appendChild(chips);
    chips.addEventListener('click', function (e) {
      var b = e.target.getAttribute && e.target.getAttribute('data-beds'); if (!b) return;
      if (e.target.getAttribute('data-exact')) sessionStorage.setItem('uwExactBeds', b); else sessionStorage.removeItem('uwExactBeds');
      form.querySelectorAll('select[name="Bedrooms"], #Bedrooms').forEach(function(s){ s.value=b; });
      form.submit();
    });
    form.addEventListener('submit', function(){ sessionStorage.removeItem('uwExactBeds'); });
  }
  var exact = sessionStorage.getItem('uwExactBeds');
  if (exact && location.pathname.indexOf('/properties')===0) { uwExactFilter(exact); }
  function sizeBeds(card){ var sz=card.querySelector('.amenity-summary-size'); var t=sz?sz.textContent:card.textContent; var mm=t.match(/(\d) Bedroom/); return mm?mm[1]:null; }
  function isCard(ch){ return ch.tagName==='HR' || (ch.querySelector && ch.querySelector('h2[id^="pname-"]')); }
  function uwNote(text, withBtn){ var n0=document.querySelector('.row'); var note=document.querySelector('.uw-filter-note'); if(!note){ note=document.createElement('div'); note.className='uw-filter-note'; var anchor=document.querySelector('h2[id^="pname-"]'); anchor=anchor?anchor.closest('.row'):n0; if(anchor&&anchor.parentNode) anchor.parentNode.insertBefore(note,anchor);} note.innerHTML='<span>'+text+'</span>'+(withBtn?' <button type="button" class="uw-chip" id="uw-show-all">Show all homes</button>':''); var sa=document.getElementById('uw-show-all'); if(sa) sa.addEventListener('click', function(){ sessionStorage.removeItem('uwExactBeds'); location.href='/properties'; }); }
  async function uwExactFilter(n){
    var names=document.querySelectorAll('h2[id^="pname-"]'); if(!names.length) return;
    var container=names[0].closest('.row').parentNode;
    [].slice.call(container.children).forEach(function(ch){ if(isCard(ch)) ch.style.display='none'; });
    uwNote('Finding all '+n+'-bedroom homes\u2026', false);
    try{
      var first=await fetch('/properties?Page=1',{credentials:'same-origin'}).then(function(r){return r.text();});
      var d1=new DOMParser().parseFromString(first,'text/html');
      var tm=(d1.body.textContent.match(/of\s+(\d+)\s+places/i)||d1.body.textContent.match(/(\d+)\s+properties/i));
      var total=tm?parseInt(tm[1],10):56; var pages=Math.min(10,Math.ceil(total/12));
      var reqs=[Promise.resolve(d1)];
      for(var p=2;p<=pages;p++){ reqs.push(fetch('/properties?Page='+p,{credentials:'same-origin'}).then(function(r){return r.text();}).then(function(t){return new DOMParser().parseFromString(t,'text/html');}).catch(function(){return null;})); }
      var docs=await Promise.all(reqs);
      var seen={}, matches=[];
      docs.forEach(function(doc){ if(!doc)return; doc.querySelectorAll('h2[id^="pname-"]').forEach(function(h){ var card=h.closest('.row'); if(!card)return; var a=card.querySelector('a[href^="/"]'); var key=a?a.getAttribute('href'):h.id; if(seen[key])return; if(sizeBeds(card)===n){ seen[key]=1; matches.push(card);} }); });
      [].slice.call(container.children).forEach(function(ch){ if(isCard(ch)) ch.remove(); });
      matches.forEach(function(c){ container.appendChild(document.importNode(c,true)); });
      document.querySelectorAll('.pagination, ul.pagination').forEach(function(el){ el.style.display='none'; });
      var hdr=[].slice.call(document.querySelectorAll('h1,h2,h3,h4,div,span,p')).find(function(el){ return el.children.length===0 && /^\s*\d+\s+propert/i.test(el.textContent); });
      if(hdr) hdr.textContent=matches.length+' '+(matches.length===1?'property':'properties');
      uwNote(matches.length?('Showing all <strong>'+matches.length+'</strong> '+n+'-bedroom homes'):('No '+n+'-bedroom homes available right now'), true);
    }catch(e){ [].slice.call(container.children).forEach(function(ch){ if(isCard(ch)) ch.style.display=''; }); var re=new RegExp('\\b'+n+' Bedroom'); names.forEach(function(nm){ var c=nm.closest('.row'); if(c && !re.test(c.textContent)) c.style.display='none'; }); uwNote('Showing '+n+'-bedroom homes', true); }
  }
});
</script>

<!-- Location badges on property cards (added by Claude) -->
<script>
(function(){
  var overrides=[['relaxing haven retreat','Barefoot Resort'],['barefoot','Barefoot Resort'],['anderson ocean club','Oceanfront'],['ocean lakes','Ocean View'],['retro','Ocean View'],['gated oceanfront','Near Ocean'],['emerald pointe','Near Ocean'],['charming 4br beach house','Near Ocean']];
  var order=[['oceanfront','Oceanfront'],['ocean front','Oceanfront'],['beachfront','Beachfront'],['waterfront','Waterfront'],['ocean view','Ocean View'],['oceanview','Ocean View'],['near ocean','Near Ocean'],['walk to','Walk to Beach']];
  var petProps=['200 ft to beach','robbers roost','winds','luster','1225'];
  function getTitle(card,tile){ if(!tile){ var t=card.querySelector('h2 a, .media-heading a'); return t?t.textContent:''; } var el=card.querySelector('.property-result-tile-title,.property-result-tile-name'); return el?el.textContent:card.textContent.split(/sleeps|\bbed/i)[0]; }
  function pill(wrap,cls,text){ wrap.style.position='relative'; var s=document.createElement('span'); s.className=cls; s.textContent=text; wrap.appendChild(s); }
  function badge(){
    document.querySelectorAll('.thumbnail, .property-result-tile-image').forEach(function(wrap){
      if(wrap.getAttribute('data-uwb')) return; wrap.setAttribute('data-uwb','1');
      var tile=wrap.classList.contains('property-result-tile-image');
      var card=tile?wrap.closest('.property-result-tile'):wrap.closest('.row'); if(!card){wrap.removeAttribute('data-uwb');return;}
      var amen=card.querySelector('.amenity-summary-amenities');
      var title=getTitle(card,tile).toLowerCase();
      var label=null;
      for(var j=0;j<overrides.length;j++){ if(title.indexOf(overrides[j][0])>-1){ label=overrides[j][1]; break; } }
      if(!label){ var txt=tile?card.textContent.toLowerCase():((amen?amen.textContent:'')+' '+title).toLowerCase(); for(var i=0;i<order.length;i++){ if(txt.indexOf(order[i][0])>-1){label=order[i][1];break;} } }
      if(label) pill(wrap,'uw-loc-badge',label);
      var petText=(title+' '+(amen?amen.textContent:'')).toLowerCase();
      var isPet=/dog stays free|pet[- ]friendly|pets welcome|dog friendly|pets allowed/.test(petText) || petProps.some(function(p){return title.indexOf(p)>-1;});
      if(isPet) pill(wrap,'uw-pet-badge','Pet Friendly');
    });
  }
  var t; function run(){ clearTimeout(t); t=setTimeout(badge,60); }
  document.addEventListener('DOMContentLoaded', function(){ badge(); try{ new MutationObserver(run).observe(document.body,{childList:true,subtree:true}); }catch(e){} });
})();
</script>
